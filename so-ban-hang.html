<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: sticky top bar with tab strip, one working column (max 1180px); cards only for forms and charts, tables flat. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#eaefed; --ink:#15221f; --muted:#5b6b66; --line:#d9e1de;
  --accent:#0d6656; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe5e3; --good:#17734a; --good-soft:#def3e7;
  --c1:#0d6656; --c2:#d4891f; --c3:#5767c9; --c4:#b8496b; --c5:#4b9bb5; --c6:#8a8f3a;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#16211e; --sunk:#1c2a26; --ink:#e3ece9; --muted:#93a59f; --line:#2a3a36;
  --accent:#4fc2a8; --accent-ink:#06201a; --accent-soft:#173a32;
  --warn:#f0b357; --warn-soft:#3a2c14; --bad:#ff8a80; --bad-soft:#3d1c1a; --good:#6fd39c; --good-soft:#163526;
  --c1:#4fc2a8; --c2:#f0a845; --c3:#8f9cf0; --c4:#e57fa0; --c5:#76c3db; --c6:#c3c76a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#16211e; --sunk:#1c2a26; --ink:#e3ece9; --muted:#93a59f; --line:#2a3a36;
  --accent:#4fc2a8; --accent-ink:#06201a; --accent-soft:#173a32;
  --warn:#f0b357; --warn-soft:#3a2c14; --bad:#ff8a80; --bad-soft:#3d1c1a; --good:#6fd39c; --good-soft:#163526;
  --c1:#4fc2a8; --c2:#f0a845; --c3:#8f9cf0; --c4:#e57fa0; --c5:#76c3db; --c6:#c3c76a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:inline-grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:13px}
.sp{flex:1}
.who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.who img{width:24px;height:24px;border-radius:50%}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:9px 12px;color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;font-weight:500}
.tabs a.on{color:var(--accent);border-color:var(--accent)}
.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{padding-block:18px 60px;display:grid;gap:18px}
h1{font-size:21px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;margin:0 0 10px;text-wrap:balance}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.head{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid2{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.grid3{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.kpis{display:grid;gap:1px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;min-width:0}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi small{display:block;color:var(--muted);font-size:12px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:160px}
tfoot td{font-weight:700;background:var(--sunk)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600}
.p-ok{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-n{background:var(--sunk);color:var(--muted)}
label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));align-items:end}
.form .wide{grid-column:1/-1}
button{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:4px 8px}
button.del{color:var(--bad)}
button.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
.note{padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink);font-size:13.5px}
.note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft)}
.chart{position:relative;height:260px}
.chart.tall{height:320px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px;font-weight:500}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent)}
.total{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.empty{padding:22px;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:20;max-width:calc(100% - 32px)}
main>*,.grid2>*,.grid3>*{min-width:0}
.top select{width:auto;padding:6px 8px}
.qty{width:76px}.price{width:120px}.pct{width:70px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><i>SB</i><span id="shopName">Sổ Bán Hàng</span></div>
      <div class="sp"></div>
      <div class="row">
        <select id="selMonth" aria-label="Tháng"></select>
        <select id="selYear" aria-label="Năm"></select>
      </div>
      <div class="who" id="who"></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<div class="wrap"><main id="view"><div class="empty">Đang tải dữ liệu cửa hàng…</div></main></div>
<div id="toast" hidden></div>

<script>
"use strict";
const CH=["Cửa hàng","Bán sỉ","Shopee","TikTok Shop","Facebook","Website"];
const EXP=["Mặt bằng","Lương nhân viên","Điện nước, internet","Vận chuyển","Quảng cáo","Phí sàn TMĐT","Thuế, phí","Khác"];
const CATS=["Điện tử","Thời trang"];
const TAB=Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const num=v=>{if(typeof v==="number")return v;const s=String(v??"").replace(/[^\d,.\-]/g,"");if(!s)return 0;const c=s.replace(/\./g,"").replace(",",".");const n=Number(c);return isFinite(n)?n:0};
const pct=v=>{const n=Number(String(v??"").replace(",","."));return isFinite(n)?n:0};
const fmt=n=>Math.round(n||0).toLocaleString("vi-VN");
const fmtM=n=>{const a=Math.abs(n||0);if(a>=1e9)return (n/1e9).toLocaleString("vi-VN",{maximumFractionDigits:2})+" tỷ";if(a>=1e6)return (n/1e6).toLocaleString("vi-VN",{maximumFractionDigits:1})+" tr";return fmt(n)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dmy=s=>s?s.slice(8,10)+"/"+s.slice(5,7):"";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const safeKey=s=>String(s).trim().replace(/[^A-Za-z0-9_\-.~:@+]/g,"-").slice(0,60);

const S={products:{},customers:{},suppliers:{},staff:{},joinreq:{},shop:{},salesA:[],salesB:[],imports:[],expenses:[],payA:[],payB:[],
  year:new Date().getFullYear(),month:new Date().getMonth()+1,loaded:{},stale:false,err:null,readOnly:false};
let db=null,user=null,downloads=null,uid=null,isOwner=false,me=null,names={},D=null,dirty=true,unsubYear=[];
const F={pos:{date:today(),channel:"Cửa hàng",cust:"KL",lines:[],paid:"",note:"",pick:"",qty:"1"},
  prod:{},paste:"",imp:{date:today(),sup:"",lines:[],paid:"",pick:"",qty:"1",cost:"",upd:true},
  exp:{date:today(),type:EXP[0],desc:"",amount:""},cust:{},pay:{},sup:{},debtTab:"kh",prodQ:"",prodCat:"",prodSt:"",staffEdit:{},
  showProdForm:false,showPaste:false,showCustForm:false,showSupForm:false};
const armed={};

/* ---------- toast & helpers ---------- */
let toastT;function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200)}
function errMsg(e){const c=e&&e.code;if(c==="invalid_argument")return"Bạn không có quyền ghi mục này.";if(c==="quota_exceeded")return"Dữ liệu đã đầy dung lượng. Hãy xóa bớt dữ liệu cũ.";if(c==="busy")return"Đang có người khác lưu cùng lúc, thử lại sau vài giây.";return"Không lưu được"+(c?" ("+c+")":"")+". Thử lại."}
async function mutateDoc(path,base,fn){
  const ref=db.doc(path);
  for(let i=0;i<6;i++){
    let ok=true;try{const l=await ref.acquire({holder:(uid||"x")+":"+TAB,ttlMs:8000});ok=l.acquired}catch(e){if(e&&e.code==="invalid_argument")throw e;ok=true}
    if(ok){const snap=await ref.get();const cur=Object.assign(structuredClone(base),snap.exists?structuredClone(snap.data()):{});const next=fn(cur);await ref.set(next);return next}
    await sleep(500+Math.random()*700);
  }
  throw {code:"busy"};
}
function confirmBtn(key,label,armedLabel){return `<button class="ghost del ${armed[key]?"arm":""}" data-act="arm" data-key="${esc(key)}">${armed[key]?esc(armedLabel||"Bấm lần nữa để xóa"):esc(label)}</button>`}

/* ---------- derived data ---------- */
function derive(){
  if(!dirty&&D)return D;dirty=false;
  const orders=[],imps=[],pays=[],exps=[];
  for(const d of [...S.salesA,...S.salesB])for(const o of (d.orders||[]))orders.push(Object.assign({},o,{date:d.date,staff:d.staff,doc:d._id,demo:!!d.demo}));
  for(const d of S.imports)for(const r of (d.receipts||[]))imps.push(Object.assign({},r,{date:d.date,doc:d._id}));
  for(const d of [...S.payA,...S.payB])for(const p of (d.items||[]))pays.push(Object.assign({},p,{date:d.date,by:d.staff,doc:d._id}));
  for(const d of S.expenses)for(const e of (d.items||[]))exps.push(Object.assign({},e,{doc:d._id}));
  orders.sort((a,b)=>(b.date+(b.time||"")).localeCompare(a.date+(a.time||"")));
  const stock={},sold={},rev={},gp={};
  for(const c in S.products){stock[c]=num(S.products[c].open);sold[c]=0;rev[c]=0;gp[c]=0}
  for(const r of imps)for(const it of r.items||[]){if(!(it.c in stock))stock[it.c]=0;stock[it.c]+=num(it.q)}
  for(const o of orders)for(const it of o.items||[]){if(!(it.c in stock))stock[it.c]=0;stock[it.c]-=num(it.q)}
  const cd={};for(const c in S.customers){const x=S.customers[c];cd[c]={open:num(x.openDebt),ps:0,thu:0}}
  for(const o of orders){const due=num(o.total)-num(o.paid);if(Math.abs(due)<1)continue;(cd[o.cust]=cd[o.cust]||{open:0,ps:0,thu:0}).ps+=due}
  const sd={};for(const c in S.suppliers){sd[c]={open:num(S.suppliers[c].openDebt),ps:0,tra:0}}
  for(const r of imps){const due=num(r.total)-num(r.paid);if(Math.abs(due)<1)continue;(sd[r.sup]=sd[r.sup]||{open:0,ps:0,tra:0}).ps+=due}
  for(const p of pays){if(p.kind==="thu")(cd[p.code]=cd[p.code]||{open:0,ps:0,thu:0}).thu+=num(p.amount);else (sd[p.code]=sd[p.code]||{open:0,ps:0,tra:0}).tra+=num(p.amount)}
  for(const k in cd)cd[k].bal=cd[k].open+cd[k].ps-cd[k].thu;
  for(const k in sd)sd[k].bal=sd[k].open+sd[k].ps-sd[k].tra;
  D={orders,imps,pays,exps,stock,cd,sd};return D;
}
const mkey=()=>S.year+"-"+pad(S.month);
const inM=d=>d&&d.slice(0,7)===mkey();
function status(code){const p=S.products[code];const s=derive().stock[code]||0;if(s<=0)return["Hết hàng","p-bad"];if(s<=num(p&&p.min))return["Sắp hết","p-warn"];return["Đủ hàng","p-ok"]}
function isStaff(){return isOwner||!!(uid&&S.staff[uid]&&S.staff[uid].active!==false)}
function nameOf(id){if(!id)return"";if(id==="demo")return"Nhân viên mẫu (dữ liệu mẫu)";const n=names[id];if(n)return n;const st=S.staff[id];if(st&&st.label)return st.label;if(S.shop.ownerId===id)return"Chủ cửa hàng";return"Nhân viên"}
async function refreshNames(){
  if(!user)return;const ids=new Set([...Object.keys(S.staff),...Object.keys(S.joinreq)]);if(S.shop.ownerId)ids.add(S.shop.ownerId);ids.delete("demo");
  if(!ids.size)return;const ps=await user.profiles([...ids]);let ch=false;
  for(const id of ids){const nm=(ps[id]&&ps[id].name)||"";if(nm&&names[id]!==nm){names[id]=nm;ch=true}}
  if(ch)schedule();
}
function custName(c){if(c==="KL"&&!S.customers.KL)return"Khách lẻ";return (S.customers[c]&&S.customers[c].name)||c}
function priceFor(code,channel,cust){const p=S.products[code];if(!p)return 0;const ct=S.customers[cust];return (channel==="Bán sỉ"||(ct&&ct.type==="Sỉ"))?num(p.wholesale):num(p.retail)}

/* ---------- routing ---------- */
const VIEWS=[["tong-quan","Tổng quan"],["ban-hang","Bán hàng"],["hang-hoa","Hàng hóa"],["nhap-hang","Nhập hàng",1],["chi-phi","Chi phí",1],["cong-no","Công nợ"],["nhan-vien","Nhân viên"],["bao-cao","Báo cáo",1]];
function cur(){const h=location.hash.slice(1);const v=VIEWS.find(x=>x[0]===h&&(!x[2]||isOwner));return v?v[0]:"tong-quan"}
function renderTabs(){const c=cur();document.getElementById("tabs").innerHTML=VIEWS.filter(v=>!v[2]||isOwner).map(v=>`<a href="#${v[0]}" class="${v[0]===c?"on":""}">${v[1]}</a>`).join("")}
function renderSelectors(){
  const ys=new Set([S.year,new Date().getFullYear(),new Date().getFullYear()-1]);
  document.getElementById("selYear").innerHTML=[...ys].sort().map(y=>`<option ${y===S.year?"selected":""}>${y}</option>`).join("");
  document.getElementById("selMonth").innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1===S.month?"selected":""}>Tháng ${i+1}</option>`).join("");
}
let raf=0,pending=false;
function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const a=document.activeElement;if(a&&a.closest&&a.closest("#view")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.dataset.live!=="1"){pending=true;return}render()})}
document.addEventListener("focusout",()=>setTimeout(()=>{if(pending){pending=false;schedule()}},0));
const charts={};
function killCharts(){for(const k in charts){charts[k].destroy();delete charts[k]}}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function render(){
  renderTabs();renderSelectors();
  document.getElementById("shopName").textContent=S.shop.name||"Sổ Bán Hàng";
  const w=document.getElementById("who");
  if(me){w.innerHTML=`<img alt="" src="${esc(me.avatarUrl)}"><span></span>`;w.querySelector("span").textContent=(me.name||"Bạn")+(isOwner?" · Chủ":isStaff()?" · Nhân viên":"")}
  killCharts();
  const v=cur();const el=document.getElementById("view");
  let html="";
  if(!db)html=`<div class="note bad">Trang này cần mở trên claude.ai khi đã đăng nhập để đọc và lưu dữ liệu cửa hàng.</div>`;
  else{
    if(S.stale&&!Object.keys(S.loaded).length)html+=`<div class="note warn">Chưa kết nối được dữ liệu. Số liệu có thể chưa đầy đủ, trang sẽ tự cập nhật khi kết nối lại.</div>`;
    if(!isOwner&&!isStaff())html+=joinPanel();
    if(Object.values(S.products).some(p=>p.demo)&&isOwner)html+=`<div class="note">Đang hiển thị <b>dữ liệu mẫu</b> để bạn xem thử. Khi bắt đầu dùng thật, vào tab Báo cáo và bấm “Xóa dữ liệu mẫu”.</div>`;
    html+=({"tong-quan":vDash,"ban-hang":vPos,"hang-hoa":vProd,"nhap-hang":vImp,"chi-phi":vExp,"cong-no":vDebt,"nhan-vien":vStaff,"bao-cao":vReport}[v])();
  }
  el.innerHTML=html;
  if(db)({"tong-quan":cDash,"bao-cao":cReport,"nhan-vien":cStaff}[v]||(()=>{}))();
  refreshNames();
}
function joinPanel(){
  const req=uid&&S.joinreq[uid];
  if(!uid)return`<div class="note warn">Bạn cần đăng nhập claude.ai để dùng trang này.</div>`;
  if(req)return`<div class="note">Đã gửi yêu cầu tham gia. Chờ chủ cửa hàng duyệt, sau đó bạn sẽ bán hàng được ngay trên trang này.</div>`;
  return`<div class="note warn row"><span style="flex:1;min-width:200px">Bạn chưa là nhân viên của cửa hàng. Gửi yêu cầu để chủ cửa hàng duyệt.</span><button class="pri" data-act="join">Gửi yêu cầu tham gia</button></div>`;
}

/* ---------- VIEW: dashboard ---------- */
function monthAgg(filterStaff){
  const d=derive();const os=d.orders.filter(o=>inM(o.date)&&(!filterStaff||o.staff===filterStaff));
  let rev=0,cogs=0;for(const o of os){rev+=num(o.total);cogs+=num(o.cogs)}
  const exp=d.exps.filter(e=>inM(e.date)).reduce((a,e)=>a+num(e.amount),0);
  return{os,rev,cogs,gp:rev-cogs,exp,profit:rev-cogs-exp};
}
function vDash(){
  const d=derive();const mine=isOwner?null:uid;const a=monthAgg(mine);
  const t=today();const tOs=d.orders.filter(o=>o.date===t&&(!mine||o.staff===mine));const tRev=tOs.reduce((s,o)=>s+num(o.total),0);
  const low=Object.keys(S.products).filter(c=>status(c)[0]!=="Đủ hàng");

    if(E)return`<tr><td>${esc(nameOf(r.id))}</td><td colspan="10"><span class="row"><label>Tên gọi<input data-f="staffEdit.${esc(r.id)}.label" value="${esc(E.label||"")}" style="width:150px"></label><label>Mã NV (1-8)<input inputmode="numeric" data-f="staffEdit.${esc(r.id)}.no" value="${esc(E.no||"")}" style="width:80px"></label><label>Chỉ tiêu tháng<input inputmode="numeric" data-f="staffEdit.${esc(r.id)}.target" value="${esc(E.target||"")}" style="width:140px"></label><label>% hoa hồng<input inputmode="decimal" data-f="staffEdit.${esc(r.id)}.commission" value="${esc(E.commission||"")}" style="width:80px"></label><button class="pri" data-act="saveStaff" data-u="${esc(r.id)}">Lưu</button><button data-act="cancelStaff" data-u="${esc(r.id)}">Hủy</button></span></td></tr>`;
    return`<tr><td>${esc(nameOf(r.id))}${st&&st.active===false?' <span class="pill p-n">Đã nghỉ</span>':""}</td><td>${st?esc(st.no):r.id===S.shop.ownerId?"Chủ":"-"}</td><td class="n">${r.n}</td><td class="n">${fmt(r.rev)}</td><td class="n">${fmt(r.gp)}</td><td class="n">${r.tg?fmt(r.tg):"-"}</td><td><div class="bar"><i style="width:${p.toFixed(0)}%"></i></div><span class="small muted">${r.tg?(r.rev/r.tg*100).toFixed(0)+"%":""}</span></td><td class="n">${st?pct(st.commission):"-"}</td><td class="n">${fmt(r.com)}</td><td class="n">${fmt(r.debt)}</td><td>${st?`<button class="ghost" data-act="editStaff" data-u="${esc(r.id)}">Sửa</button><button class="ghost" data-act="toggleStaff" data-u="${esc(r.id)}">${st.active===false?"Cho làm lại":"Cho nghỉ"}</button>`:""}</td></tr>`}).join("")}</tbody></table></div>`;
  h+=`<div class="card"><h2>Doanh thu và chỉ tiêu</h2><div class="chart"><canvas id="chSt"></canvas></div></div>`;
  return h;
}
function cStaff(){if(!window.Chart)return;const d=derive();const P=pal();
  if(!isOwner){const days=new Date(S.year,S.month,0).getDate();const rev=Array(days).fill(0);for(const o of d.orders)if(inM(o.date)&&o.staff===uid)rev[Number(o.date.slice(8,10))-1]+=num(o.total);mk("chMe",{data:{labels:rev.map((_,i)=>String(i+1)),datasets:[{type:"bar",label:"Doanh thu",data:rev,backgroundColor:P[0],borderRadius:3}]},options:baseOpts()});return}
  const st={};for(const o of d.orders)if(inM(o.date))st[o.staff]=(st[o.staff]||0)+num(o.total);const ids=[...new Set([...Object.keys(S.staff),...Object.keys(st)])];
  mk("chSt",{data:{labels:ids.map(nameOf),datasets:[{type:"bar",label:"Doanh thu",data:ids.map(i=>st[i]||0),backgroundColor:P[0],borderRadius:3},{type:"bar",label:"Chỉ tiêu",data:ids.map(i=>num(S.staff[i]&&S.staff[i].target)),backgroundColor:cssv("--line"),borderRadius:3}]},options:baseOpts()})}

/* ---------- VIEW: report ---------- */
function yearRows(){const d=derive();const rows=Array.from({length:12},(_,i)=>({m:i+1,rev:0,cogs:0,exp:0,imp:0,n:0}));
  for(const o of d.orders){if(o.date.slice(0,4)!==String(S.year))continue;const r=rows[Number(o.date.slice(5,7))-1];r.rev+=num(o.total);r.cogs+=num(o.cogs);r.n++}
  for(const e of d.exps){if((e.date||"").slice(0,4)!==String(S.year))continue;rows[Number(e.date.slice(5,7))-1].exp+=num(e.amount)}
  for(const i of d.imps){if(i.date.slice(0,4)!==String(S.year))continue;rows[Number(i.date.slice(5,7))-1].imp+=num(i.total)}
  return rows}
function vReport(){
  const rows=yearRows();const T=rows.reduce((a,r)=>({rev:a.rev+r.rev,cogs:a.cogs+r.cogs,exp:a.exp+r.exp,imp:a.imp+r.imp,n:a.n+r.n}),{rev:0,cogs:0,exp:0,imp:0,n:0});const d=derive();
  const yo=d.orders.filter(o=>o.date.slice(0,4)===String(S.year));
  const byCh=CH.map(c=>{const os=yo.filter(o=>o.channel===c);return[c,os.reduce((s,o)=>s+num(o.total),0),os.reduce((s,o)=>s+num(o.total)-num(o.cogs),0)]});
  let h=`<div class="head"><h1>Báo cáo năm ${S.year}</h1><div class="row"><button data-act="csv">Tải đơn tháng ${S.month} (CSV)</button></div></div>`;
  h+=`<div class="kpis">${kpi("Doanh thu năm",fmt(T.rev),T.n+" đơn")}${kpi("Lãi gộp",fmt(T.rev-T.cogs),T.rev?((T.rev-T.cogs)/T.rev*100).toFixed(1)+"%":"")}${kpi("Chi phí",fmt(T.exp),"")}${kpi("Lợi nhuận",fmt(T.rev-T.cogs-T.exp),T.rev?((T.rev-T.cogs-T.exp)/T.rev*100).toFixed(1)+"%":"")}${kpi("Tiền nhập hàng",fmt(T.imp),"")}</div>`;
  h+=`<div class="card"><h2>Doanh thu, chi phí và lợi nhuận theo tháng</h2><div class="chart tall"><canvas id="chYear"></canvas></div></div>`;
  h+=`<div class="tbl"><table><thead><tr><th>Tháng</th><th class="n">Số đơn</th><th class="n">Doanh thu</th><th class="n">Giá vốn</th><th class="n">Lãi gộp</th><th class="n">Chi phí</th><th class="n">Lợi nhuận</th><th class="n">Tỷ suất LN</th><th class="n">Tiền nhập hàng</th></tr></thead><tbody>${rows.map(r=>`<tr><td>Tháng ${r.m}</td><td class="n">${r.n}</td><td class="n">${fmt(r.rev)}</td><td class="n">${fmt(r.cogs)}</td><td class="n">${fmt(r.rev-r.cogs)}</td><td class="n">${fmt(r.exp)}</td><td class="n">${fmt(r.rev-r.cogs-r.exp)}</td><td class="n">${r.rev?((r.rev-r.cogs-r.exp)/r.rev*100).toFixed(1)+"%":"-"}</td><td class="n">${fmt(r.imp)}</td></tr>`).join("")}</tbody><tfoot><tr><td>Cả năm</td><td class="n">${T.n}</td><td class="n">${fmt(T.rev)}</td><td class="n">${fmt(T.cogs)}</td><td class="n">${fmt(T.rev-T.cogs)}</td><td class="n">${fmt(T.exp)}</td><td class="n">${fmt(T.rev-T.cogs-T.exp)}</td><td class="n">${T.rev?((T.rev-T.cogs-T.exp)/T.rev*100).toFixed(1)+"%":"-"}</td><td class="n">${fmt(T.imp)}</td></tr></tfoot></table></div>`;
  h+=`<div class="grid2"><div><h2>Theo kênh bán (cả năm)</h2><div class="tbl"><table><thead><tr><th>Kênh</th><th class="n">Doanh thu</th><th class="n">Lãi gộp</th><th class="n">Tỷ trọng</th></tr></thead><tbody>${byCh.map(r=>`<tr><td>${r[0]}</td><td class="n">${fmt(r[1])}</td><td class="n">${fmt(r[2])}</td><td class="n">${T.rev?(r[1]/T.rev*100).toFixed(1)+"%":"-"}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="card"><h2>Cài đặt cửa hàng</h2><div class="form"><label class="wide">Tên cửa hàng<input id="shopIn" data-f="shopName" value="${esc(F.shopName??S.shop.name??"")}"></label><button class="pri" data-act="saveShop">Lưu tên</button></div>
  ${Object.values(S.products).some(p=>p.demo)||d.orders.some(o=>o.demo)?`<p class="muted small">Dữ liệu mẫu đang bật. Xóa trước khi nhập dữ liệu thật.</p>${confirmBtn("demo","Xóa dữ liệu mẫu","Bấm lần nữa: xóa toàn bộ dữ liệu mẫu")}`:""}</div></div>`;
  return h;
}
function cReport(){if(!window.Chart)return;const rows=yearRows();const P=pal();
  mk("chYear",{data:{labels:rows.map(r=>"T"+r.m),datasets:[{type:"bar",label:"Doanh thu",data:rows.map(r=>r.rev),backgroundColor:P[0],borderRadius:3},{type:"bar",label:"Chi phí",data:rows.map(r=>r.exp),backgroundColor:P[1],borderRadius:3},{type:"line",label:"Lợi nhuận",data:rows.map(r=>r.rev-r.cogs-r.exp),borderColor:P[3],backgroundColor:P[3],tension:.3}]},options:baseOpts()})}
async function exportCsv(){
  if(!downloads){toast("Trang này không tải file được ở đây.");return}
  const d=derive();const os=d.orders.filter(o=>inM(o.date));const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
  const lines=[["Số đơn","Ngày","Giờ","Kênh","Mã KH","Khách hàng","Mã hàng","Tên hàng","SL","Đơn giá","CK %","Thành tiền","Đã trả (cả đơn)","Người bán"].map(q).join(",")];
  for(const o of os)for(const it of o.items||[])lines.push([o.no,o.date,o.time,o.channel,o.cust,custName(o.cust),it.c,(S.products[it.c]||{}).name||"",it.q,it.p,it.d,Math.round(it.q*it.p*(1-pct(it.d)/100)),o.paid,nameOf(o.staff)].map(q).join(","));
  try{await downloads.save({filename:"don-hang-"+mkey()+".csv",data:"﻿"+lines.join("\r\n")})}catch(e){if(e&&e.code!=="declined")toast("Không tải được file.")}
}

/* ---------- delete handlers ---------- */
async function doDelete(key){
  const [t,a,b]=key.split("|");
  try{
    if(t==="o")await mutateDoc(a,{orders:[]},doc=>{doc.orders=doc.orders.filter(o=>o.id!==b);return doc});
    else if(t==="i")await mutateDoc(a,{receipts:[]},doc=>{doc.receipts=doc.receipts.filter(o=>o.id!==b);return doc});
    else if(t==="e")await mutateDoc(a,{items:[]},doc=>{doc.items=doc.items.filter(o=>o.id!==b);return doc});
    else if(t==="y")await mutateDoc(a,{items:[]},doc=>{doc.items=doc.items.filter(o=>o.id!==b);return doc});
    else if(t==="p")await db.doc("products/"+a).delete();
    else if(t==="r")await db.doc("joinreq/"+a).delete();
    else if(t==="demo"){toast("Đang xóa dữ liệu mẫu…");for(const c of ["products","customers","suppliers","sales","imports","expenses","payments"]){const s=await db.collection(c).where("demo","==",true).get();for(const x of s.docs)await db.doc(c+"/"+x.id).delete()}toast("Đã xóa dữ liệu mẫu");}
    if(t!=="demo")toast("Đã xóa");
  }catch(e){toast(errMsg(e))}
  delete armed[key];schedule();
}

/* ---------- events ---------- */
function setF(path,val){const ks=path.split(".");let o=F;for(let i=0;i<ks.length-1;i++){o[ks[i]]=o[ks[i]]||{};o=o[ks[i]]}o[ks[ks.length-1]]=val}
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.f){setF(t.dataset.f,t.type==="checkbox"?t.checked:t.value);if(t.dataset.f==="pos.paid")return;if(t.dataset.act==="rerender"&&t.tagName==="INPUT"){const pos=t.selectionStart;render();const n=document.querySelector(`[data-f="${t.dataset.f}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}}
  if(t.dataset.line!=null){const l=F.pos.lines[Number(t.dataset.line)];if(!l)return;l[t.dataset.k]=t.dataset.k==="p"?num(t.value):t.value;if(t.dataset.k==="p")l.manual=true;
    const a=document.getElementById("amt"+t.dataset.line);if(a)a.textContent=fmt(num(l.q)*num(l.p)*(1-pct(l.d)/100));const tt=document.getElementById("posTotal");if(tt)tt.textContent=fmt(posTotal())}
});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.f)setF(t.dataset.f,t.type==="checkbox"?t.checked:t.value);
  if(t.dataset.act==="reprice"){for(const l of F.pos.lines)if(!l.manual)l.p=priceFor(l.c,F.pos.channel,F.pos.cust);render()}
  else if(t.dataset.act==="rerender"&&t.tagName==="SELECT")render();
  else if(t.dataset.f==="pos.date"||t.dataset.f==="imp.sup")render();
  if(t.id==="selMonth"){S.month=Number(t.value);render()}
  if(t.id==="selYear"){S.year=Number(t.value);subscribeYear();render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="posPick"||e.target.dataset.f==="pos.qty")){e.preventDefault();act("addLine",e.target)}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.tagName==="SELECT"||b.tagName==="INPUT")return;e.preventDefault();act(b.dataset.act,b)});
async function act(a,b){
  const ds=b?b.dataset:{};
  switch(a){
    case"arm":{const k=ds.key;if(armed[k]){doDelete(k)}else{for(const x in armed)delete armed[x];armed[k]=1;render();setTimeout(()=>{if(armed[k]){delete armed[k];schedule()}},4000)}break}
    case"join":try{await db.doc("joinreq/"+uid).set({at:new Date().toISOString()});toast("Đã gửi yêu cầu")}catch(e){toast(errMsg(e))}schedule();break;
    case"addLine":{const c=pickCode(F.pos.pick);if(!c){toast("Không tìm thấy mã hàng này.");return}const q=num(F.pos.qty)||1;const ex=F.pos.lines.find(l=>l.c===c&&!l.manual);if(ex)ex.q=num(ex.q)+q;else F.pos.lines.push({c,q,p:priceFor(c,F.pos.channel,F.pos.cust),d:0});F.pos.pick="";F.pos.qty="1";render();const n=document.getElementById("posPick");if(n)n.focus();break}
    case"rmLine":F.pos.lines.splice(Number(ds.i),1);render();break;
    case"saveOrder":saveOrder();break;
    case"newProd":F.prod={cat:CATS[0],unit:"Cái",open:0,min:5};F.showProdForm=true;render();break;
    case"editProd":F.prod=Object.assign({_edit:true},S.products[ds.c]);F.showProdForm=true;render();window.scrollTo({top:0});break;
    case"closeProd":F.showProdForm=false;render();break;
    case"saveProd":{const p=cleanProd(F.prod);p.code=safeKey(p.code);if(!p.code||!p.name){toast("Cần có mã và tên hàng.");return}if(!F.prod._edit&&S.products[p.code]){toast("Mã "+p.code+" đã có.");return}
      try{await db.doc("products/"+p.code).set(p);F.showProdForm=false;toast("Đã lưu "+p.code)}catch(e){toast(errMsg(e))}render();break}
    case"togglePaste":F.showPaste=!F.showPaste;render();break;
    case"doPaste":doPaste();break;
    case"addImpLine":{const c=pickCode(F.imp.pick);if(!c){toast("Không tìm thấy mã hàng này.");return}const q=num(F.imp.qty);if(!q){toast("Nhập số lượng.");return}F.imp.lines.push({c,q,p:String(F.imp.cost).trim()?num(F.imp.cost):num(S.products[c].cost)});F.imp.pick="";F.imp.qty="1";F.imp.cost="";render();break}
    case"rmImp":F.imp.lines.splice(Number(ds.i),1);render();break;
    case"saveImp":saveImp();break;
    case"saveExp":saveExp();break;
    case"debtTab":F.debtTab=ds.t;render();break;
    case"newCust":F.cust={type:"Sỉ",openDebt:0,limit:0};F.showCustForm=true;render();break;
    case"editCust":F.cust=Object.assign({_edit:true},S.customers[ds.c]);F.showCustForm=true;render();window.scrollTo({top:0});break;
    case"closeCust":F.showCustForm=false;render();break;
    case"saveCust":{const C=F.cust;const code=safeKey(String(C.code||"").toUpperCase());if(!code||!C.name){toast("Cần có mã và tên khách.");return}if(!C._edit&&S.customers[code]){toast("Mã "+code+" đã có.");return}
      const old=S.customers[code]||{};const body={code,name:String(C.name).trim(),phone:C.phone||"",type:C.type||"Lẻ",addr:C.addr||"",openDebt:isOwner?num(C.openDebt):num(old.openDebt),limit:isOwner?num(C.limit):num(old.limit)};
      try{await db.doc("customers/"+code).set(body);F.showCustForm=false;toast("Đã lưu khách "+code)}catch(e){toast(errMsg(e))}render();break}
    case"newSup":F.sup={openDebt:0};F.showSupForm=true;render();break;
    case"editSup":F.sup=Object.assign({_edit:true},S.suppliers[ds.c]);F.showSupForm=true;render();break;
    case"closeSup":F.showSupForm=false;render();break;
    case"saveSup":{const C=F.sup;const code=safeKey(String(C.code||"").toUpperCase());if(!code||!C.name){toast("Cần có mã và tên.");return}
      try{await db.doc("suppliers/"+code).set({code,name:String(C.name).trim(),phone:C.phone||"",openDebt:num(C.openDebt)});F.showSupForm=false;toast("Đã lưu "+code)}catch(e){toast(errMsg(e))}render();break}
    case"openPay":F.pay[ds.c]={amount:""};render();break;
    case"closePay":delete F.pay[ds.c];render();break;
    case"savePay":savePay(ds.c,ds.kind);break;
    case"approve":{const used=Object.values(S.staff).map(s=>Number(s.no));let no=1;while(used.includes(no))no++;
      try{await db.doc("staff/"+ds.u).set({no,target:0,commission:0,active:true,label:"",since:today()});await db.doc("joinreq/"+ds.u).delete().catch(()=>{});toast("Đã duyệt nhân viên số "+no)}catch(e){toast(errMsg(e))}schedule();break}
    case"editStaff":{const s=S.staff[ds.u];F.staffEdit[ds.u]={label:s.label||"",no:String(s.no||""),target:String(s.target||""),commission:String(s.commission||"")};render();break}
    case"cancelStaff":delete F.staffEdit[ds.u];render();break;
    case"saveStaff":{const E=F.staffEdit[ds.u];try{await db.doc("staff/"+ds.u).update({label:E.label||"",no:num(E.no)||S.staff[ds.u].no,target:num(E.target),commission:pct(E.commission)});delete F.staffEdit[ds.u];toast("Đã lưu")}catch(e){toast(errMsg(e))}render();break}
    case"toggleStaff":{const s=S.staff[ds.u];try{await db.doc("staff/"+ds.u).update({active:s.active===false})}catch(e){toast(errMsg(e))}break}
    case"saveShop":try{await db.doc("settings/shop").set(Object.assign({},S.shop,{name:String(F.shopName??S.shop.name??"").trim()}));toast("Đã lưu tên cửa hàng")}catch(e){toast(errMsg(e))}break;
    case"csv":exportCsv();break;
  }
}
window.addEventListener("hashchange",()=>{window.scrollTo({top:0});render()});

/* ---------- data subscriptions ---------- */
function sub(key,q,apply){
  const t=setTimeout(()=>{S.stale=true;schedule()},10000);
  return q.onSnapshot(snap=>{if(!snap.metadata.fromCache){clearTimeout(t);S.loaded[key]=1}apply(snap);dirty=true;schedule()},err=>{clearTimeout(t);S.err=err.code;schedule()});
}
const asMap=snap=>{const o={};for(const d of snap.docs)o[d.id]=d.data();return o};
function subscribeStatic(){
  sub("products",db.collection("products"),s=>S.products=asMap(s));
  sub("customers",db.collection("customers"),s=>S.customers=asMap(s));
  sub("suppliers",db.collection("suppliers"),s=>S.suppliers=asMap(s));
  sub("staff",db.collection("staff"),s=>S.staff=asMap(s));
  sub("joinreq",db.collection("joinreq"),s=>S.joinreq=asMap(s));
  sub("shop",db.doc("settings/shop"),s=>{S.shop=s.exists?s.data():{};if(isOwner&&uid&&S.shop.ownerId!==uid&&!s.metadata.fromCache)db.doc("settings/shop").set(Object.assign({},S.shop,{ownerId:uid})).catch(()=>{})});
}
function subscribeYear(){
  for(const u of unsubYear)u();unsubYear=[];const y=S.year;
  const withPath=(col)=>s=>s.docs.map(d=>Object.assign({},d.data(),{_id:col+"/"+d.id}));
  unsubYear.push(sub("salesA",db.collection("sales").where("date",">=",y+"-01-01").where("date","<",y+"-07-01"),s=>S.salesA=withPath("sales")(s)));
  unsubYear.push(sub("salesB",db.collection("sales").where("date",">=",y+"-07-01").where("date","<=",y+"-12-31"),s=>S.salesB=withPath("sales")(s)));
  unsubYear.push(sub("imports",db.collection("imports").where("date",">=",y+"-01-01").where("date","<=",y+"-12-31"),s=>S.imports=withPath("imports")(s)));
  unsubYear.push(sub("payA",db.collection("payments").where("date",">=",y+"-01-01").where("date","<",y+"-07-01"),s=>S.payA=withPath("payments")(s)));
  unsubYear.push(sub("payB",db.collection("payments").where("date",">=",y+"-07-01").where("date","<=",y+"-12-31"),s=>S.payB=withPath("payments")(s)));
  if(isOwner)unsubYear.push(sub("expenses",db.collection("expenses").where("month",">=",y+"-01").where("month","<=",y+"-12"),s=>S.expenses=withPath("expenses")(s)));
  dirty=true;
}
async function boot(){
  render();
  const c=window.claude;
  if(!c||!c.use){render();return}
  [db,user,downloads]=await Promise.all([c.use("db"),c.use("user"),c.use("downloads")]);
  if(user){[isOwner,me]=await Promise.all([user.isOwner(),user.me()]);uid=me.id;const w=await user.can("data.write");if(w===false)S.readOnly=true}
  if(!db){render();return}
  subscribeStatic();subscribeYear();render();
}
boot();
</script>
